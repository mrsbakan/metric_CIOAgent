input {
  # Application logs over TCP (JSON format)
  tcp {
    port  => 5000
    codec => json_lines
  }

  # Beats input (Filebeat, Metricbeat)
  beats {
    port => 5044
  }
}

filter {
  # Parse structured log fields
  if [log_type] == "audit" {
    mutate {
      add_tag => ["audit"]
    }
  }

  # Drop noisy health-check logs
  if [path] =~ "^/health" or [path] =~ "^/metrics" {
    drop {}
  }

  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts     => ["http://elasticsearch:9200"]
    index     => "cio-agent-%{+YYYY.MM.dd}"
    # Separate index for audit logs with 2-year retention
    index     => "%{[log_type] == 'audit' ? 'cio-audit' : 'cio-agent'}-%{+YYYY.MM.dd}"
  }

  # Debug to stdout in dev
  stdout {
    codec => rubydebug
  }
}
