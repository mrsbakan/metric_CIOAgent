services:

  # ── PostgreSQL — Main App DB (with pgvector) ─────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cio_agent
      POSTGRES_USER: ${POSTGRES_USER:-cio_agent_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-main.sh:/docker-entrypoint-initdb.d/init-main.sh:ro
      - ./database/migrations:/migrations:ro
      - ./database/policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cio_agent_app} -d cio_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cio-network

  # ── PostgreSQL — Audit DB (append-only, INSERT-only app user) ────────────────
  postgres-audit:
    image: postgres:16-alpine
    container_name: cio-postgres-audit
    restart: unless-stopped
    environment:
      POSTGRES_DB: cio_agent_audit
      POSTGRES_USER: ${AUDIT_POSTGRES_USER:-cio_agent_audit_app}
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:-change_me}
    ports:
      - "${AUDIT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
      - ./infra/postgres/init-audit.sh:/docker-entrypoint-initdb.d/init-audit.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_POSTGRES_USER:-cio_agent_audit_app} -d cio_agent_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cio-network

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cio-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cio-network

  # ── HashiCorp Vault — Dev Mode ────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: cio-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - ./infra/vault/init.sh:/vault/init.sh:ro
      - ./infra/vault/policies:/vault/policies:ro
    command: ["vault", "server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cio-network

  # ── Langfuse — LLM Tracing ───────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:3
    container_name: cio-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cio_agent_app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/langfuse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD:-change_me}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-nextauth-secret-change-me}
      SALT: ${LANGFUSE_SALT:-dev-salt-change-me}
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cio-network

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cio-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cio-network

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: cio-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cio-network

  # ── Grafana Tempo — Distributed Tracing ──────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: cio-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${GRAFANA_TEMPO_PORT:-3200}:3200"   # HTTP API
      - "4317:4317"                           # OTLP gRPC
      - "4318:4318"                           # OTLP HTTP
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cio-network

  # ── Elasticsearch ────────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: cio-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: cio-agent
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - cio-network

  # ── Logstash ─────────────────────────────────────────────────────────────────
  logstash:
    image: logstash:8.14.0
    container_name: cio-logstash
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "5044:5044"   # Beats input
      - "5000:5000"   # TCP input (app logs)
      - "9600:9600"   # Logstash API
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9600 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cio-network

  # ── Kibana ───────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.14.0
    container_name: cio-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cio-network

# ── Volumes ──────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  postgres-audit-data:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  elasticsearch-data:

# ── Networks ─────────────────────────────────────────────────────────────────────
networks:
  cio-network:
    driver: bridge
